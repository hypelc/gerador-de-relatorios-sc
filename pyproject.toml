[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gerador-relatorios-sc"
version = "0.1.0"
description = "Aplicacao desktop local para gerar relatorios de indicadores de Santa Catarina"
requires-python = ">=3.12,<3.15"
dependencies = [
  "matplotlib==3.11.1",
  "openpyxl==3.1.5",
  "shapely==2.1.2",
  "pyproj==3.8.0",
  "PySide6==6.11.2",
  "pypdf==6.1.3",
]

[project.scripts]
gerador-relatorios-sc = "gerador_sc.ui:run_app"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gerador_sc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
